<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fabric Store · Materials for a life handmade</title>
<link rel="stylesheet" href="/css/style.css?v=2">
</head>
<body>
<header>
<h1>
<a href="/">Fabric Store</a>
</h1>
<nav aria-label="Main navigation">
<a href="/browse">Browse fabrics</a>
<a href="/#story">Our story</a>
<a href="/login">Log in</a>
<a class="button secondary" href="/register-user">Join the making</a>
</nav>
</header>
<main>
<div class="auth-layout">
<img class="auth-photo" src="/images/stacked_fabrics.jpg" alt="Stacks of beautifully textured fabrics">
<div class="auth-panel">
<span class="eyebrow">Your creative corner</span>
<h2>Make yourself at home.</h2>
<p>A little inspiration for your next handmade chapter.</p>
<form th:action="@{/register-user}" method="post" th:object="${customer}">
<input type="hidden" name="_csrf" th:value="${csrfToken}">
<label for="name">Your name</label>
<input id="name" th:field="*{name}" autocomplete="name" required minlength="2" maxlength="30" placeholder="Your name">
<label for="email">Email address</label>
<input id="email" type="email" th:field="*{email}" autocomplete="email" required placeholder="you@example.com">
<label for="password">Password · 5–20 characters</label>
<input id="password" type="password" th:field="*{password}" autocomplete="new-password" required minlength="5" maxlength="20" placeholder="Choose a password">
<button class="btn" type="submit">Create account <span aria-hidden="true">↗</span>
</button>
</form>
<p class="notice" role="status" th:if="${regcheck}" th:text="${regcheck}">
</p>
<p>Already part of the community? <a class="text-link" href="/login">Log in</a>
</p>
</div>
</div>
</main>
<footer>
<p>&copy; 2026 Lily Clairevelle · Fabric Store</p>
</footer>
</body>
</html>
