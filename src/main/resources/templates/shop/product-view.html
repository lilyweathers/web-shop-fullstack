<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fabric Store · Materials for a life handmade</title>
<link rel="stylesheet" href="/css/style.css?v=2">
</head>
<body>
<header>
<h1>
<a th:href="${authenticated} ? '/home' : '/'" href="/">Fabric Store</a>
</h1>
<nav aria-label="Main navigation">
<a th:href="${authenticated} ? '/home' : '/'" href="/">Home</a>
<a href="/browse">Browse fabrics</a>
<a th:if="${authenticated}" href="/orders">Orders</a>
<a th:if="${authenticated}" href="/profile" th:text="${login}">My account</a>
<a th:if="${authenticated}" href="/cart">Bag</a>
<a th:if="${authenticated}" href="/logout">Log out</a>
<a th:unless="${authenticated}" href="/login">Log in</a>
<a th:unless="${authenticated}" class="button secondary" href="/register-user">Create account</a>
</nav>
</header>
<main>
<section>
<a class="text-link" href="/browse">? Back to all fabrics</a>
<div class="product-detail">
<img class="detail-image" th:src="${product.img}" th:alt="${product.name}">
<div class="detail-copy">
<span class="eyebrow" th:text="${product.category}">
</span>
<h2 th:text="${product.name}">
</h2>
<p th:text="${product.description}">
</p>
<p class="detail-price">
<span th:text="${#numbers.formatDecimal(product.price, 1, 2)}">
</span> SEK</p>
<form action="/product-add" method="post">
<label for="quantity">Quantity</label>
<input id="quantity" class="quantity" type="number" name="count" min="1" value="1" required>
<input type="hidden" name="id" th:value="${product.id}">
<button class="btn" type="submit">Add to bag ?</button>
</form>
<p class="notice" role="status" th:if="${message}" th:text="${message}">
</p>
<p class="detail-note">A little texture for your next handmade idea.</p>
</div>
</div>
</section>
</main><footer>
<p>&copy; 2026 Lily Clairevelle · Fabric Store</p>
</footer>
</body>
</html>
