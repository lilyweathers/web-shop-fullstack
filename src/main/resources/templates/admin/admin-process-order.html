<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order details &middot; Fabric Store Admin</title>
<link rel="stylesheet" href="/css/style.css?v=10">
</head>
<body>
<header class="admin-header">
<h1>
<a href="/admin-view">Fabric Store</a> <span class="admin-badge">Admin</span>
</h1>
<nav aria-label="Admin navigation">
<a href="/admin-view">Products</a>
<a href="/admin-add">Add fabric</a>
<a href="/admin-pending" aria-current="page">Orders</a>
<a href="/admin-profile" th:text="${login}">My account</a>
<form class="nav-logout" action="/logout-admin" method="post"><input type="hidden" name="_csrf" th:value="${csrfToken}"><button type="submit">Log out</button></form>
</nav>
</header>
<main>
<section class="order-detail-page">
<a class="text-link" href="/admin-process">&#8592; Back to confirmed orders</a>
<div class="order-detail-heading">
<div>
<span class="eyebrow">Customer order</span>
<h2 th:text="${order}">
</h2>
</div>
<span class="status-pill">Confirmed</span>
</div>
<div class="order-detail-layout">
<div class="order-summary">
<div class="summary-heading">
<h3>The chosen fabrics</h3>
<span class="eyebrow" th:text="${#lists.size(items) + ' selections'}">
</span>
</div>
<div class="order-line" th:each="item : ${items}">
<div class="fabric-swatch" aria-hidden="true">&#10035;</div>
<div class="order-line-name">
<h4 th:text="${item.product}">
</h4>
<p>
<span th:text="${item.category}">
</span> &middot; Qty <span th:text="${item.count}">
</span>
</p>
</div>
<span class="receipt-price">
<span th:text="${#numbers.formatDecimal(item.price, 1, 2)}">
</span> SEK</span>
</div>
<p class="order-detail-total" th:text="${total}">
</p>
</div>
<aside class="order-progress">
<span class="eyebrow">Where things stand</span>
<h3>Confirmed</h3>
<p>Confirmed orders waiting to be sent on their way.</p>
<div class="admin-order-actions">
<form action="/admin-process-confirm" method="post">
<input type="hidden" name="_csrf" th:value="${csrfToken}">
<input type="hidden" name="id" th:value="${id}">
<button class="btn" type="submit">Dispatch order &#8599;</button>
</form>
<form action="/admin-process-cancel" method="post">
<input type="hidden" name="_csrf" th:value="${csrfToken}">
<input type="hidden" name="id" th:value="${id}">
<button class="button secondary cancel-button" type="submit">Cancel order</button>
</form>
</div>
<a class="text-link" href="/admin-process">Return to the queue &#8599;</a>
</aside>
</div>
</section>
</main>
<footer>
<p>&copy; 2026 Lily Clairevelle &middot; Fabric Store Admin</p>
</footer>
</body>
</html>
