<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fabric Store Admin · Materials for a life handmade</title>
<link rel="stylesheet" href="/css/style.css?v=10">
</head>
<body>
<header class="admin-header"><h1><a href="/admin">Fabric Store</a> <span class="admin-badge">Admin</span></h1><nav aria-label="Admin navigation"><a href="/">Visit store</a><a href="/login-admin">Log in</a><a href="/register-admin">Register</a></nav></header>
<main>
<div class="auth-layout">
<img class="auth-photo" src="/images/stacked_fabrics.jpg" alt="Stacks of beautifully textured fabrics">
<div class="auth-panel">
<span class="eyebrow">Behind the collection</span>
<h2>Welcome back, maker.</h2>
<p>Manage your fabrics, keep orders moving, and make room for new ideas.</p>
<form action="/login-admin" method="post">
<label for="email">Email address</label>
<input id="email" type="email" name="email" autocomplete="email" required placeholder="you@example.com">
<label for="password">Password</label>
<input id="password" type="password" name="password" autocomplete="current-password" required placeholder="Your password">
<button class="btn" type="submit">Log in <span aria-hidden="true">↗</span>
</button>
</form>
<p class="notice" role="status" th:if="${login}" th:text="${login}">
</p>
<p>New to the store? <a class="text-link" href="/register-admin">Create an account</a>
</p>
</div>
</div>
</main>
<footer>
<p>&copy; 2026 Lily Clairevelle · Fabric Store</p>
</footer>
</body>
</html>
