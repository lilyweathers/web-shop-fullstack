<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fabric Store Admin · Materials for a life handmade</title>
<link rel="stylesheet" href="/css/style.css?v=10">
</head>
<body>
<header class="admin-header"><h1><a href="/admin">Fabric Store</a> <span class="admin-badge">Admin</span></h1><nav aria-label="Admin navigation"><a href="/">Visit store</a><a href="/login-admin">Log in</a><a th:if="${adminRegistrationEnabled}" href="/register-admin">Register</a></nav></header>
<main>
<div class="auth-layout">
<img class="auth-photo" src="/images/stacked_fabrics.jpg" alt="Stacks of beautifully textured fabrics">
<div class="auth-panel">
<span class="eyebrow">Create an admin account</span>
<h2>Join the studio.</h2>
<p>Your workspace for the collection and the people who love it.</p>
<form th:action="@{/register-admin}" method="post" th:object="${employee}">
<input type="hidden" name="_csrf" th:value="${csrfToken}">
<label for="name">Your name</label>
<input id="name" th:field="*{name}" autocomplete="name" required minlength="2" maxlength="30" placeholder="Your name">
<label for="email">Email address</label>
<input id="email" type="email" th:field="*{email}" autocomplete="email" required placeholder="you@example.com">
<label for="password">Password · 5–20 characters</label>
<input id="password" type="password" th:field="*{password}" autocomplete="new-password" required minlength="5" maxlength="20" placeholder="Choose a password">
<button class="btn" type="submit">Create account <span aria-hidden="true">↗</span>
</button>
</form>
<p class="notice" role="status" th:if="${regcheck}" th:text="${regcheck}">
</p>
<p>Already part of the community? <a class="text-link" href="/login-admin">Log in</a>
</p>
</div>
</div>
</main>
<footer>
<p>&copy; 2026 Lily Clairevelle · Fabric Store</p>
</footer>
</body>
</html>
