spring.config.import=optional:file:.env.local.properties
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/webshop}
spring.datasource.username=${DB_USERNAME:user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.web.resources.static-locations=classpath:/static/
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
app.admin-registration-enabled=${ADMIN_REGISTRATION_ENABLED:false}
app.bootstrap-admin-email=${ADMIN_EMAIL:}
app.bootstrap-admin-password=${ADMIN_PASSWORD:}
app.seed-products=${SEED_PRODUCTS:false}
